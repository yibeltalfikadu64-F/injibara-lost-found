services:
  postgres:
    image: postgres:16-alpine
    container_name: injibara_lost_found_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: injibara_lost_found
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d injibara_lost_found"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: